<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeleTube Pro</title>
    
    <!-- Evita o erro 404 do favicon -->
    <link rel="icon" href="data:,">

    <!-- Tailwind CSS para Estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React e ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para compilar o JSX direto no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Este mapa de importação previne o erro "Failed to resolve module specifier" -->
    <script type="importmap">
        {
            "imports": {
                "domhandler": "https://esm.sh/domhandler@5.0.3",
                "domutils": "https://esm.sh/domutils@3.1.0"
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans">
    
    <div id="root"></div>

    <script type="module">
        // 1. Carrega o Buffer (Essencial para a criptografia do Telegram funcionar no Navegador)
        import { Buffer } from "https://esm.sh/buffer@6.0.3";
        window.Buffer = Buffer;
        window.global = window;

        console.log("Iniciando download do motor Telegram...");

        try {
            // 2. Carrega o pacote GramJS com os polyfills de criptografia para não quebrar o WebSocket
            const tg = await import("https://esm.sh/telegram@2.22.2?bundle&alias=crypto:crypto-browserify,stream:stream-browserify&external=domhandler,domutils");
            
            // 3. Salva as classes principais na janela global para o React poder usar
            window.TelegramClient = tg.TelegramClient;
            window.Api = tg.Api;
            window.StringSession = tg.sessions.StringSession;
            
            console.log("Motor Telegram carregado com sucesso!");
            
            // 4. Avisa o React que o motor está pronto
            window.dispatchEvent(new Event('gramjs-ready'));
        } catch (error) {
            console.error("Erro fatal ao importar pacote:", error);
            alert("Erro ao carregar o motor do Telegram. Verifique a aba Console (F12).");
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [isEngineReady, setIsEngineReady] = useState(false);
            const [status, setStatus] = useState('initial'); // initial, auth_phone, auth_code, connected
            const [apiId, setApiId] = useState(localStorage.getItem('tg_api_id') || '');
            const [apiHash, setApiHash] = useState(localStorage.getItem('tg_api_hash') || '');
            const [channelId, setChannelId] = useState(localStorage.getItem('tg_channel_id') || '');
            const [phoneNumber, setPhoneNumber] = useState('');
            const [phoneCode, setPhoneCode] = useState('');
            const [phoneCodeHash, setPhoneCodeHash] = useState('');
            const [sessionString, setSessionString] = useState(localStorage.getItem('tg_session') || '');
            
            const [activeTab, setActiveTab] = useState('acervo'); // acervo, enviar
            const [videos, setVideos] = useState([]);
            const [loadingVideos, setLoadingVideos] = useState(false);
            
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploading, setUploading] = useState(false);
            const [videoTitle, setVideoTitle] = useState('');
            const fileInputRef = useRef(null);
            
            // Instância global do cliente
            const clientRef = useRef(null);

            // Aguarda o script de módulo carregar o GramJS
            useEffect(() => {
                if (window.TelegramClient && window.StringSession) {
                    setIsEngineReady(true);
                } else {
                    const handleReady = () => setIsEngineReady(true);
                    window.addEventListener('gramjs-ready', handleReady);
                    return () => window.removeEventListener('gramjs-ready', handleReady);
                }
            }, []);

            const initClient = async () => {
                if (!window.TelegramClient || !window.StringSession) {
                    alert("Aguarde, o motor ainda está sendo baixado...");
                    return false;
                }

                if (!clientRef.current) {
                    const session = new window.StringSession(sessionString);
                    clientRef.current = new window.TelegramClient(
                        session, 
                        parseInt(apiId), 
                        apiHash, 
                        { connectionRetries: 5 }
                    );
                    await clientRef.current.connect();
                }
                return true;
            };

            // Ao clicar em conectar (Tenta reconectar se já tiver sessão)
            const handleInitialConnect = async () => {
                if (!apiId || !apiHash || !channelId) {
                    alert("Preencha as credenciais da API e do Canal!");
                    return;
                }
                
                localStorage.setItem('tg_api_id', apiId);
                localStorage.setItem('tg_api_hash', apiHash);
                localStorage.setItem('tg_channel_id', channelId);

                if (sessionString) {
                    setStatus('connecting');
                    try {
                        const ready = await initClient();
                        if (ready && await clientRef.current.checkAuthorization()) {
                            setStatus('connected');
                            loadVideos();
                        } else {
                            setStatus('auth_phone');
                        }
                    } catch (e) {
                        console.error("Sessão inválida", e);
                        setStatus('auth_phone');
                    }
                } else {
                    setStatus('auth_phone');
                }
            };

            const handleSendPhone = async () => {
                if (!phoneNumber) return;
                setStatus('connecting');
                try {
                    await initClient();
                    const result = await clientRef.current.sendCode(
                        { apiId: parseInt(apiId), apiHash }, 
                        phoneNumber
                    );
                    setPhoneCodeHash(result.phoneCodeHash);
                    setStatus('auth_code');
                } catch (e) {
                    console.error("Erro ao enviar telefone", e);
                    alert("Erro ao enviar telefone. Verifique o número e as credenciais.");
                    setStatus('auth_phone');
                }
            };

            const handleVerifyCode = async () => {
                if (!phoneCode) return;
                setStatus('connecting');
                try {
                    await clientRef.current.signInUser(
                        { apiId: parseInt(apiId), apiHash },
                        { phoneNumber, phoneCodeHash, phoneCode }
                    );
                    
                    const newSession = clientRef.current.session.save();
                    setSessionString(newSession);
                    localStorage.setItem('tg_session', newSession);
                    
                    setStatus('connected');
                    loadVideos();
                } catch (e) {
                    console.error("Erro ao verificar código", e);
                    alert("Código incorreto ou expirado.");
                    setStatus('auth_code');
                }
            };

            const handleLogout = async () => {
                localStorage.removeItem('tg_session');
                setSessionString('');
                if (clientRef.current) await clientRef.current.disconnect();
                clientRef.current = null;
                setStatus('initial');
            };

            const loadVideos = async () => {
                if (!clientRef.current) return;
                setLoadingVideos(true);
                try {
                    // Busca as últimas 30 mensagens do canal
                    const messages = await clientRef.current.getMessages(channelId, { limit: 30 });
                    
                    const videoMsgs = messages.filter(m => m.media && m.media.document && m.media.document.mimeType.includes('video'));
                    
                    const formattedVideos = videoMsgs.map(m => {
                        const title = m.message || "Vídeo sem título";
                        return {
                            id: m.id,
                            title: title,
                            size: (m.media.document.size / (1024 * 1024)).toFixed(2) + ' MB',
                            date: new Date(m.date * 1000).toLocaleDateString(),
                            deepLink: `https://t.me/c/${channelId.replace('-100', '')}/${m.id}`
                        };
                    });
                    
                    setVideos(formattedVideos);
                } catch (e) {
                    console.error("Erro ao carregar vídeos", e);
                }
                setLoadingVideos(false);
            };

            const handleUpload = async () => {
                const file = fileInputRef.current?.files[0];
                if (!file) {
                    alert("Selecione um vídeo primeiro.");
                    return;
                }
                if (!clientRef.current) return;

                setUploading(true);
                setUploadProgress(0);

                try {
                    const messageText = videoTitle || file.name;
                    
                    // Envio pelo GramJS suportando progress callback para arquivos grandes
                    await clientRef.current.sendFile(channelId, {
                        file: file,
                        caption: messageText,
                        progressCallback: (progress) => {
                            // progress é um float de 0.0 a 1.0
                            setUploadProgress(Math.round(progress * 100));
                        }
                    });

                    alert("Upload concluído com sucesso!");
                    setVideoTitle('');
                    fileInputRef.current.value = '';
                    setActiveTab('acervo');
                    loadVideos();
                } catch (e) {
                    console.error("Erro no upload:", e);
                    alert("Erro ao fazer o upload. Veja o console.");
                } finally {
                    setUploading(false);
                    setUploadProgress(0);
                }
            };

            if (status !== 'connected') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-900">
                        <div className="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-gray-700">
                            <h1 className="text-3xl font-bold mb-6 text-center text-blue-500">TeleTube Pro</h1>
                            
                            {!isEngineReady && (
                                <div className="bg-blue-900/50 text-blue-300 p-3 rounded mb-4 text-center text-sm border border-blue-700 animate-pulse">
                                    ⚙️ Baixando Motor Criptográfico do Telegram...
                                </div>
                            )}

                            {status === 'initial' && (
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">API ID (my.telegram.org)</label>
                                        <input type="text" value={apiId} onChange={e => setApiId(e.target.value)} className="w-full p-3 bg-gray-700 rounded text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: 1234567" />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">API HASH</label>
                                        <input type="text" value={apiHash} onChange={e => setApiHash(e.target.value)} className="w-full p-3 bg-gray-700 rounded text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: a1b2c3d4..." />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">ID do Canal</label>
                                        <input type="text" value={channelId} onChange={e => setChannelId(e.target.value)} className="w-full p-3 bg-gray-700 rounded text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: -10012345678" />
                                    </div>
                                    <button 
                                        onClick={handleInitialConnect} 
                                        disabled={!isEngineReady}
                                        className={`w-full p-3 rounded font-bold transition ${isEngineReady ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-gray-600 text-gray-400 cursor-not-allowed'}`}>
                                        Avançar
                                    </button>
                                </div>
                            )}

                            {status === 'auth_phone' && (
                                <div className="space-y-4">
                                    <p className="text-gray-300 text-sm text-center">Precisamos conectar à sua conta do Telegram para permitir o upload de arquivos grandes.</p>
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">Seu Número (com +55 e DDD)</label>
                                        <input type="text" value={phoneNumber} onChange={e => setPhoneNumber(e.target.value)} className="w-full p-3 bg-gray-700 rounded text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="+5511999999999" />
                                    </div>
                                    <button onClick={handleSendPhone} className="w-full bg-blue-600 hover:bg-blue-700 text-white p-3 rounded font-bold transition">
                                        Enviar SMS / Código
                                    </button>
                                </div>
                            )}

                            {status === 'auth_code' && (
                                <div className="space-y-4">
                                    <p className="text-gray-300 text-sm text-center">Digite o código de 5 dígitos que o Telegram enviou no seu aplicativo oficial.</p>
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">Código de Verificação</label>
                                        <input type="text" value={phoneCode} onChange={e => setPhoneCode(e.target.value)} className="w-full p-3 bg-gray-700 rounded text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="12345" />
                                    </div>
                                    <button onClick={handleVerifyCode} className="w-full bg-green-600 hover:bg-green-700 text-white p-3 rounded font-bold transition">
                                        Verificar e Entrar
                                    </button>
                                </div>
                            )}

                            {status === 'connecting' && (
                                <div className="flex flex-col items-center py-8">
                                    <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                                    <p className="text-gray-300">Conectando aos servidores do Telegram...</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-gray-900 pb-20">
                    {/* Header */}
                    <header className="bg-gray-800 p-4 shadow-md sticky top-0 z-10 border-b border-gray-700 flex justify-between items-center">
                        <h1 className="text-xl font-bold text-blue-500">TeleTube Pro</h1>
                        <button onClick={handleLogout} className="text-sm text-red-400 hover:text-red-300 px-3 py-1 bg-red-400/10 rounded-full">Sair</button>
                    </header>

                    {/* Conteúdo das Abas */}
                    <main className="flex-1 p-4 w-full max-w-2xl mx-auto">
                        
                        {/* Aba Acervo */}
                        {activeTab === 'acervo' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold text-white">Acervo do Canal</h2>
                                    <button onClick={loadVideos} className="bg-gray-700 hover:bg-gray-600 p-2 rounded-full text-white">
                                        🔄 Atualizar
                                    </button>
                                </div>

                                {loadingVideos ? (
                                    <div className="text-center text-gray-400 py-10">
                                        <div className="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                                        Lendo mensagens do canal...
                                    </div>
                                ) : videos.length === 0 ? (
                                    <div className="text-center text-gray-500 py-10 bg-gray-800 rounded-xl border border-gray-700">
                                        <p>Nenhum vídeo encontrado no canal.</p>
                                    </div>
                                ) : (
                                    <div className="grid gap-4">
                                        {videos.map(video => (
                                            <div key={video.id} className="bg-gray-800 p-4 rounded-xl shadow border border-gray-700 flex flex-col sm:flex-row gap-4 items-center">
                                                <div className="w-full sm:w-24 h-24 bg-gray-700 rounded-lg flex items-center justify-center text-3xl">
                                                    🎬
                                                </div>
                                                <div className="flex-1 text-left w-full">
                                                    <h3 className="font-bold text-lg text-gray-100 line-clamp-2">{video.title}</h3>
                                                    <div className="flex gap-3 text-sm text-gray-400 mt-2">
                                                        <span>📅 {video.date}</span>
                                                        <span>💾 {video.size}</span>
                                                    </div>
                                                </div>
                                                {/* Botão de Deeplink que abre direto no App Oficial */}
                                                <a href={video.deepLink} className="w-full sm:w-auto text-center bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-bold transition">
                                                    Assistir Nativo
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Aba Enviar */}
                        {activeTab === 'enviar' && (
                            <div className="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
                                <h2 className="text-2xl font-bold text-white mb-6">Enviar Novo Vídeo</h2>
                                
                                <div className="space-y-6">
                                    <div>
                                        <label className="block text-gray-400 mb-2 font-medium">Título ou Legenda (com hashtags)</label>
                                        <textarea 
                                            value={videoTitle} 
                                            onChange={e => setVideoTitle(e.target.value)}
                                            className="w-full p-3 bg-gray-900 border border-gray-600 rounded-lg text-white focus:ring-2 focus:ring-blue-500 outline-none resize-none" 
                                            rows="3"
                                            placeholder="Ex: Aula de Matemática 01 #matematica"
                                            disabled={uploading}
                                        ></textarea>
                                    </div>

                                    <div>
                                        <label className="block text-gray-400 mb-2 font-medium">Arquivo de Vídeo (Até 2GB)</label>
                                        <input 
                                            type="file" 
                                            accept="video/*" 
                                            ref={fileInputRef}
                                            className="w-full p-3 bg-gray-900 border border-gray-600 rounded-lg text-white file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700"
                                            disabled={uploading}
                                        />
                                    </div>

                                    {uploading && (
                                        <div className="bg-gray-900 p-4 rounded-lg border border-gray-700">
                                            <div className="flex justify-between text-sm mb-2">
                                                <span className="text-blue-400 font-bold">Enviando para o Telegram...</span>
                                                <span className="text-white">{uploadProgress}%</span>
                                            </div>
                                            <div className="w-full bg-gray-700 rounded-full h-3">
                                                <div className="bg-blue-500 h-3 rounded-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>
                                            </div>
                                        </div>
                                    )}

                                    <button 
                                        onClick={handleUpload} 
                                        disabled={uploading}
                                        className={`w-full p-4 rounded-lg font-bold text-lg transition ${uploading ? 'bg-gray-600 text-gray-400 cursor-not-allowed' : 'bg-green-600 hover:bg-green-500 text-white'}`}>
                                        {uploading ? 'Enviando em segundo plano...' : 'Fazer Upload'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Bottom Navigation */}
                    <nav className="fixed bottom-0 w-full bg-gray-800 border-t border-gray-700 flex">
                        <button 
                            onClick={() => setActiveTab('acervo')} 
                            className={`flex-1 py-4 flex flex-col items-center gap-1 transition ${activeTab === 'acervo' ? 'text-blue-500' : 'text-gray-400 hover:text-gray-300'}`}>
                            <span className="text-xl">📺</span>
                            <span className="text-xs font-bold">Acervo</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('enviar')} 
                            className={`flex-1 py-4 flex flex-col items-center gap-1 transition ${activeTab === 'enviar' ? 'text-blue-500' : 'text-gray-400 hover:text-gray-300'}`}>
                            <span className="text-xl">☁️</span>
                            <span className="text-xs font-bold">Enviar</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
