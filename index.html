<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeleTube Pro</title>
    
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "telegram": "https://esm.sh/telegram@2.22.2?external=crypto,stream,buffer,events,path,net,tls,fs,os,domhandler,domutils",
                "crypto": "https://esm.sh/crypto-browserify@3.12.0",
                "node:crypto": "https://esm.sh/crypto-browserify@3.12.0",
                "stream": "https://esm.sh/stream-browserify@3.0.0",
                "node:stream": "https://esm.sh/stream-browserify@3.0.0",
                "buffer": "https://esm.sh/buffer@6.0.3",
                "node:buffer": "https://esm.sh/buffer@6.0.3",
                "events": "https://esm.sh/events@3.3.0",
                "node:events": "https://esm.sh/events@3.3.0",
                "path": "https://esm.sh/path-browserify@1.0.1",
                "node:path": "https://esm.sh/path-browserify@1.0.1",
                "net": "https://esm.sh/net-browserify@0.2.4",
                "node:net": "https://esm.sh/net-browserify@0.2.4",
                "tls": "https://esm.sh/tls-browserify@0.1.2",
                "node:tls": "https://esm.sh/tls-browserify@0.1.2",
                "fs": "https://esm.sh/browserify-fs@1.0.0",
                "node:fs": "https://esm.sh/browserify-fs@1.0.0",
                "os": "https://esm.sh/os-browserify@0.3.0",
                "node:os": "https://esm.sh/os-browserify@0.3.0",
                "domhandler": "https://esm.sh/domhandler@5.0.3",
                "domutils": "https://esm.sh/domutils@3.1.0"
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans selection:bg-blue-500 selection:text-white">
    <div id="root"></div>

    <script type="module">
        console.log("Iniciando ambiente de alta performance...");

        try {
            // Injeção global do Buffer e GlobalThis para a Criptografia funcionar sem o 'unenv'
            const bufferModule = await import("buffer");
            window.Buffer = window.Buffer || bufferModule.Buffer;
            window.global = window.global || window;
            
            console.log("Baixando pacotes de Criptografia e Telegram...");
            const tg = await import("telegram");
            
            window.TelegramClient = tg.TelegramClient;
            window.Api = tg.Api;
            window.StringSession = tg.sessions.StringSession;
            
            console.log("Motor MTProto pronto para uso.");
            window.dispatchEvent(new Event('gramjs-ready'));
            
        } catch (error) {
            console.error("Erro fatal na injeção:", error);
            // Fallback de erro via DOM pois o React pode não carregar a tempo
            document.body.innerHTML += `<div style="padding: 20px; color: red; text-align: center; background: #222; position: fixed; top: 0; width: 100%;">Erro ao carregar motor de conexão. Verifique o console.</div>`;
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Componente de Modal para substituir o alert()
        function Modal({ isOpen, title, message, onClose }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
                    <div className="bg-gray-800 rounded-2xl p-6 w-full max-w-sm border border-gray-700 shadow-2xl flex flex-col items-center text-center">
                        <div className="w-12 h-12 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center text-2xl mb-4">
                            ℹ️
                        </div>
                        <h3 className="text-xl font-bold text-white mb-2">{title}</h3>
                        <p className="text-gray-300 mb-6">{message}</p>
                        <button 
                            onClick={onClose} 
                            className="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl text-white font-bold transition shadow-lg shadow-blue-900/50">
                            Entendido
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            // Estados Gerais
            const [isEngineReady, setIsEngineReady] = useState(false);
            const [status, setStatus] = useState('initial'); // initial, auth_phone, auth_code, auth_password, connected
            const [activeTab, setActiveTab] = useState('acervo');
            
            // Credenciais
            const [apiId, setApiId] = useState(localStorage.getItem('tg_api_id') || '');
            const [apiHash, setApiHash] = useState(localStorage.getItem('tg_api_hash') || '');
            const [channelId, setChannelId] = useState(localStorage.getItem('tg_channel_id') || '');
            const [sessionString, setSessionString] = useState(localStorage.getItem('tg_session') || '');
            
            // Auth Inputs
            const [phoneNumber, setPhoneNumber] = useState('');
            const [phoneCode, setPhoneCode] = useState('');
            const [password, setPassword] = useState('');

            // Promessas de Autenticação (A mágica para não bloquear o GramJS)
            const phonePromiseRef = useRef(null);
            const codePromiseRef = useRef(null);
            const passwordPromiseRef = useRef(null);
            
            // Dados e UI
            const [videos, setVideos] = useState([]);
            const [loadingVideos, setLoadingVideos] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploading, setUploading] = useState(false);
            const [videoTitle, setVideoTitle] = useState('');
            
            // Modal Customizado
            const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '' });
            
            const fileInputRef = useRef(null);
            const clientRef = useRef(null);

            useEffect(() => {
                if (window.TelegramClient && window.StringSession) {
                    setIsEngineReady(true);
                } else {
                    const handleReady = () => setIsEngineReady(true);
                    window.addEventListener('gramjs-ready', handleReady);
                    return () => window.removeEventListener('gramjs-ready', handleReady);
                }
            }, []);

            const showMessage = (title, message) => {
                setModalConfig({ isOpen: true, title, message });
            };

            const handleConnect = async () => {
                if (!apiId || !apiHash || !channelId) {
                    return showMessage("Aviso", "Preencha a API ID, API HASH e o ID do Canal.");
                }
                
                localStorage.setItem('tg_api_id', apiId);
                localStorage.setItem('tg_api_hash', apiHash);
                localStorage.setItem('tg_channel_id', channelId);
                
                setStatus('connecting');

                try {
                    const session = new window.StringSession(sessionString);
                    const client = new window.TelegramClient(session, parseInt(apiId), apiHash, { 
                        connectionRetries: 5,
                        useWSS: true // Garante uso de WebSocket Seguro
                    });
                    
                    clientRef.current = client;

                    // O client.start gerencia TODO o fluxo. Ele pausa e chama as funções abaixo quando precisa de algo.
                    await client.start({
                        phoneNumber: async () => {
                            setStatus('auth_phone');
                            return new Promise(resolve => { phonePromiseRef.current = resolve });
                        },
                        password: async () => {
                            setStatus('auth_password');
                            return new Promise(resolve => { passwordPromiseRef.current = resolve });
                        },
                        phoneCode: async () => {
                            setStatus('auth_code');
                            return new Promise(resolve => { codePromiseRef.current = resolve });
                        },
                        onError: (err) => {
                            console.error("Erro no Auth Flow:", err);
                            showMessage("Erro de Autenticação", "Houve um problema: " + err.message);
                            setStatus('initial');
                        },
                    });

                    // Se passou pelo start(), estamos conectados!
                    const newSession = client.session.save();
                    setSessionString(newSession);
                    localStorage.setItem('tg_session', newSession);
                    
                    setStatus('connected');
                    loadVideos();

                } catch (e) {
                    console.error("Erro fatal ao conectar:", e);
                    showMessage("Erro de Conexão", "Falha na conexão. Verifique suas credenciais e internet.");
                    setStatus('initial');
                }
            };

            const submitPhone = () => {
                if (!phoneNumber) return showMessage("Aviso", "Digite seu número.");
                if (phonePromiseRef.current) phonePromiseRef.current(phoneNumber);
            };

            const submitCode = () => {
                if (!phoneCode) return showMessage("Aviso", "Digite o código recebido.");
                if (codePromiseRef.current) codePromiseRef.current(phoneCode);
            };

            const submitPassword = () => {
                if (!password) return showMessage("Aviso", "Digite sua senha (2FA).");
                if (passwordPromiseRef.current) passwordPromiseRef.current(password);
            };

            const handleLogout = async () => {
                localStorage.removeItem('tg_session');
                setSessionString('');
                if (clientRef.current) await clientRef.current.disconnect();
                clientRef.current = null;
                setStatus('initial');
            };

            const loadVideos = async () => {
                if (!clientRef.current) return;
                setLoadingVideos(true);
                try {
                    // Tenta converter o canalID para BigInt ou Entity
                    let peer = channelId;
                    if (!isNaN(channelId)) peer = parseInt(channelId);

                    const messages = await clientRef.current.getMessages(peer, { limit: 50 });
                    
                    // Filtra mensagens que possuem documentos do tipo vídeo
                    const videoMsgs = messages.filter(m => m.media && m.media.document && m.media.document.mimeType && m.media.document.mimeType.includes('video'));
                    
                    const formattedVideos = videoMsgs.map(m => {
                        const fileNameAttr = m.media.document.attributes?.find(a => a.className === 'DocumentAttributeFilename');
                        const fileName = fileNameAttr ? fileNameAttr.fileName : "Vídeo do Canal";
                        const title = m.message || fileName;
                        
                        // Link direto de streaming (DeepLink oficial do Telegram)
                        const cleanChannelId = channelId.toString().replace('-100', '');
                        
                        return {
                            id: m.id,
                            title: title,
                            size: (m.media.document.size / (1024 * 1024)).toFixed(2) + ' MB',
                            date: new Date(m.date * 1000).toLocaleDateString('pt-BR'),
                            deepLink: `https://t.me/c/${cleanChannelId}/${m.id}`
                        };
                    });
                    
                    setVideos(formattedVideos);
                } catch (e) {
                    console.error("Erro ao carregar vídeos", e);
                    showMessage("Erro", "Não conseguimos ler o canal. Verifique se você faz parte dele e se o ID está correto.");
                } finally {
                    setLoadingVideos(false);
                }
            };

            const handleUpload = async () => {
                const file = fileInputRef.current?.files[0];
                if (!file) return showMessage("Aviso", "Selecione um vídeo primeiro.");
                if (!clientRef.current) return;

                setUploading(true);
                setUploadProgress(0);

                try {
                    let peer = channelId;
                    if (!isNaN(channelId)) peer = parseInt(channelId);

                    const messageText = videoTitle || file.name;
                    
                    // Envio pelo GramJS suportando progress callback e Workers múltiplos para arquivos gigantes (até 2GB)
                    await clientRef.current.sendFile(peer, {
                        file: file,
                        caption: messageText,
                        workers: 4, // Divide o arquivo em blocos e envia 4 simultâneos
                        progressCallback: (progress) => {
                            setUploadProgress(Math.round(progress * 100));
                        }
                    });

                    showMessage("Sucesso", "Upload concluído com sucesso e enviado para o seu canal!");
                    setVideoTitle('');
                    fileInputRef.current.value = '';
                    setActiveTab('acervo');
                    loadVideos();
                } catch (e) {
                    console.error("Erro no upload:", e);
                    showMessage("Erro no Upload", "Ocorreu um erro ao enviar o arquivo: " + e.message);
                } finally {
                    setUploading(false);
                    setUploadProgress(0);
                }
            };

            if (status !== 'connected') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-900">
                        <Modal {...modalConfig} onClose={() => setModalConfig({ ...modalConfig, isOpen: false })} />
                        
                        <div className="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700">
                            <div className="flex justify-center mb-6">
                                <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/50">
                                    <span className="text-3xl">🚀</span>
                                </div>
                            </div>
                            <h1 className="text-3xl font-bold mb-2 text-center text-white">TeleTube Pro</h1>
                            <p className="text-gray-400 text-center mb-8 text-sm">Upload de Vídeos em Massa até 2GB</p>
                            
                            {!isEngineReady && (
                                <div className="bg-blue-900/50 text-blue-300 p-3 rounded-lg mb-6 text-center text-sm border border-blue-700/50 flex items-center justify-center gap-2">
                                    <div className="w-4 h-4 border-2 border-blue-300 border-t-transparent rounded-full animate-spin"></div>
                                    Preparando Criptografia MTProto...
                                </div>
                            )}

                            {status === 'initial' && (
                                <div className="space-y-4 animate-fade-in">
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-400 mb-1">API ID</label>
                                        <input type="text" value={apiId} onChange={e => setApiId(e.target.value)} className="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: 1234567" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-400 mb-1">API HASH</label>
                                        <input type="text" value={apiHash} onChange={e => setApiHash(e.target.value)} className="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: a1b2c3d4..." />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-400 mb-1">ID do Canal Alvo</label>
                                        <input type="text" value={channelId} onChange={e => setChannelId(e.target.value)} className="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: -10012345678" />
                                    </div>
                                    <button 
                                        onClick={handleConnect} 
                                        disabled={!isEngineReady}
                                        className={`w-full p-4 rounded-xl font-bold transition shadow-lg mt-4 ${isEngineReady ? 'bg-blue-600 hover:bg-blue-500 text-white shadow-blue-900/50' : 'bg-gray-700 text-gray-500 cursor-not-allowed'}`}>
                                        Conectar e Sincronizar
                                    </button>
                                </div>
                            )}

                            {status === 'connecting' && (
                                <div className="flex flex-col items-center py-10 animate-fade-in">
                                    <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(59,130,246,0.5)]"></div>
                                    <p className="text-gray-300 font-medium">Estabelecendo WebSocket Seguro...</p>
                                    <p className="text-gray-500 text-sm mt-2 text-center">Isso pode levar alguns segundos na primeira vez.</p>
                                </div>
                            )}

                            {status === 'auth_phone' && (
                                <div className="space-y-4 animate-fade-in">
                                    <div className="bg-gray-700/50 p-4 rounded-xl border border-gray-600 mb-4">
                                        <p className="text-gray-300 text-sm text-center">Insira o telefone da sua conta de desenvolvedor para logar e permitir envios gigantes.</p>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-400 mb-1">Seu Número (+55 e DDD)</label>
                                        <input type="tel" value={phoneNumber} onChange={e => setPhoneNumber(e.target.value)} className="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="+5511999999999" />
                                    </div>
                                    <button onClick={submitPhone} className="w-full bg-blue-600 hover:bg-blue-500 shadow-lg shadow-blue-900/50 text-white p-4 rounded-xl font-bold transition">
                                        Enviar Código
                                    </button>
                                </div>
                            )}

                            {status === 'auth_code' && (
                                <div className="space-y-4 animate-fade-in">
                                    <div className="bg-green-900/30 p-4 rounded-xl border border-green-800 mb-4">
                                        <p className="text-green-400 text-sm text-center">Código enviado! Abra seu aplicativo do Telegram em outro dispositivo e digite o código de 5 dígitos abaixo.</p>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-400 mb-1">Código do Telegram</label>
                                        <input type="text" value={phoneCode} onChange={e => setPhoneCode(e.target.value)} className="w-full p-4 bg-gray-900 border border-gray-700 rounded-xl text-white font-mono text-center tracking-widest text-xl focus:ring-2 focus:ring-blue-500 outline-none" placeholder="12345" />
                                    </div>
                                    <button onClick={submitCode} className="w-full bg-green-600 hover:bg-green-500 shadow-lg shadow-green-900/50 text-white p-4 rounded-xl font-bold transition">
                                        Verificar e Entrar
                                    </button>
                                </div>
                            )}

                            {status === 'auth_password' && (
                                <div className="space-y-4 animate-fade-in">
                                    <p className="text-gray-300 text-sm text-center">Sua conta possui Autenticação de 2 Fatores ativa. Insira a senha.</p>
                                    <div>
                                        <label className="block text-sm font-semibold text-gray-400 mb-1">Senha (2FA)</label>
                                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Sua senha..." />
                                    </div>
                                    <button onClick={submitPassword} className="w-full bg-blue-600 hover:bg-blue-500 shadow-lg shadow-blue-900/50 text-white p-4 rounded-xl font-bold transition">
                                        Desbloquear Conta
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-gray-900 pb-24">
                    <Modal {...modalConfig} onClose={() => setModalConfig({ ...modalConfig, isOpen: false })} />

                    {/* Header PWA */}
                    <header className="bg-gray-800/90 backdrop-blur p-4 shadow-lg sticky top-0 z-10 border-b border-gray-700 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <div className="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">🚀</div>
                            <h1 className="text-xl font-bold text-white tracking-tight">TeleTube <span className="text-blue-500">Pro</span></h1>
                        </div>
                        <button onClick={handleLogout} className="text-xs font-bold text-red-400 hover:text-red-300 px-4 py-2 bg-red-400/10 hover:bg-red-400/20 rounded-xl transition">
                            Desconectar
                        </button>
                    </header>

                    <main className="flex-1 p-4 w-full max-w-3xl mx-auto">
                        
                        {/* Aba Acervo */}
                        {activeTab === 'acervo' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="flex justify-between items-center">
                                    <div>
                                        <h2 className="text-2xl font-bold text-white">Acervo do Canal</h2>
                                        <p className="text-gray-400 text-sm">Mostrando os últimos 50 vídeos</p>
                                    </div>
                                    <button onClick={loadVideos} className="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-xl text-white font-medium flex items-center gap-2 transition">
                                        <span>🔄</span> Atualizar
                                    </button>
                                </div>

                                {loadingVideos ? (
                                    <div className="flex flex-col items-center justify-center py-20">
                                        <div className="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_15px_rgba(59,130,246,0.5)]"></div>
                                        <span className="text-gray-400">Varrendo histórico do canal...</span>
                                    </div>
                                ) : videos.length === 0 ? (
                                    <div className="text-center text-gray-500 py-16 bg-gray-800/50 rounded-2xl border border-gray-700 border-dashed">
                                        <div className="text-5xl mb-4 opacity-50">📂</div>
                                        <p className="text-lg">Nenhum vídeo encontrado.</p>
                                        <p className="text-sm mt-1">Faça um upload para começar.</p>
                                    </div>
                                ) : (
                                    <div className="grid gap-4 sm:grid-cols-2">
                                        {videos.map(video => (
                                            <div key={video.id} className="bg-gray-800 p-5 rounded-2xl shadow-md border border-gray-700 flex flex-col gap-4 hover:border-gray-500 transition-colors">
                                                <div className="flex items-start gap-3">
                                                    <div className="w-12 h-12 shrink-0 bg-gray-900 rounded-xl flex items-center justify-center text-2xl border border-gray-700">
                                                        🎬
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <h3 className="font-bold text-gray-100 truncate" title={video.title}>{video.title}</h3>
                                                        <div className="flex gap-3 text-xs font-medium text-gray-400 mt-1">
                                                            <span className="bg-gray-900 px-2 py-1 rounded-md border border-gray-700">📅 {video.date}</span>
                                                            <span className="bg-gray-900 px-2 py-1 rounded-md border border-gray-700">💾 {video.size}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <a href={video.deepLink} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 shadow-lg shadow-blue-900/30 text-white px-4 py-3 rounded-xl font-bold transition">
                                                    <span>▶️</span> Reproduzir no Telegram
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Aba Enviar */}
                        {activeTab === 'enviar' && (
                            <div className="animate-fade-in">
                                <div className="bg-gray-800 p-6 sm:p-8 rounded-3xl shadow-xl border border-gray-700 relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 bg-blue-500/10 rounded-full blur-3xl"></div>
                                    
                                    <h2 className="text-2xl font-bold text-white mb-2">Novo Envio</h2>
                                    <p className="text-gray-400 mb-8 text-sm">Arquivos suportados até 2GB por vídeo.</p>
                                    
                                    <div className="space-y-6 relative z-10">
                                        <div>
                                            <label className="block text-gray-300 mb-2 font-medium">Título / Legenda</label>
                                            <textarea 
                                                value={videoTitle} 
                                                onChange={e => setVideoTitle(e.target.value)}
                                                className="w-full p-4 bg-gray-900 border border-gray-600 rounded-2xl text-white focus:ring-2 focus:ring-blue-500 outline-none resize-none" 
                                                rows="3"
                                                placeholder="Ex: Aula Completa - Módulo 1 #curso"
                                                disabled={uploading}
                                            ></textarea>
                                        </div>

                                        <div>
                                            <label className="block text-gray-300 mb-2 font-medium">Arquivo de Vídeo</label>
                                            <div className="relative">
                                                <input 
                                                    type="file" 
                                                    accept="video/*" 
                                                    ref={fileInputRef}
                                                    className="w-full p-3 bg-gray-900 border border-gray-600 rounded-2xl text-white file:mr-4 file:py-2.5 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-gray-700 file:text-white hover:file:bg-gray-600 file:cursor-pointer cursor-pointer focus:outline-none"
                                                    disabled={uploading}
                                                />
                                            </div>
                                        </div>

                                        {uploading && (
                                            <div className="bg-gray-900/80 p-5 rounded-2xl border border-gray-700 backdrop-blur-sm">
                                                <div className="flex justify-between items-end mb-3">
                                                    <div>
                                                        <span className="block text-blue-400 font-bold text-sm mb-1">Processando blocos e enviando...</span>
                                                        <span className="text-gray-400 text-xs">Mantenha a tela ligada no celular.</span>
                                                    </div>
                                                    <span className="text-white font-bold text-xl">{uploadProgress}%</span>
                                                </div>
                                                <div className="w-full bg-gray-800 rounded-full h-4 border border-gray-700 overflow-hidden shadow-inner">
                                                    <div className="bg-gradient-to-r from-blue-600 to-blue-400 h-full transition-all duration-300 relative" style={{ width: `${uploadProgress}%` }}>
                                                        <div className="absolute inset-0 bg-white/20 animate-pulse"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <button 
                                            onClick={handleUpload} 
                                            disabled={uploading}
                                            className={`w-full py-4 rounded-2xl font-bold text-lg transition shadow-xl flex items-center justify-center gap-2 ${uploading ? 'bg-gray-700 text-gray-400 cursor-not-allowed shadow-none' : 'bg-green-600 hover:bg-green-500 text-white shadow-green-900/40'}`}>
                                            {uploading ? (
                                                <>
                                                    <div className="w-5 h-5 border-2 border-gray-400 border-t-transparent rounded-full animate-spin"></div>
                                                    Enviando...
                                                </>
                                            ) : (
                                                <><span>☁️</span> Iniciar Upload</>
                                            )}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Menu PWA Bottom */}
                    <nav className="fixed bottom-0 w-full bg-gray-800/95 backdrop-blur-md border-t border-gray-700 flex pb-safe">
                        <button 
                            onClick={() => setActiveTab('acervo')} 
                            className={`flex-1 py-4 flex flex-col items-center gap-1.5 transition-colors relative ${activeTab === 'acervo' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-300'}`}>
                            {activeTab === 'acervo' && <div className="absolute top-0 w-12 h-1 bg-blue-500 rounded-b-full"></div>}
                            <span className="text-2xl">📺</span>
                            <span className="text-[11px] uppercase tracking-wider font-bold">Acervo</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('enviar')} 
                            className={`flex-1 py-4 flex flex-col items-center gap-1.5 transition-colors relative ${activeTab === 'enviar' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-300'}`}>
                            {activeTab === 'enviar' && <div className="absolute top-0 w-12 h-1 bg-blue-500 rounded-b-full"></div>}
                            <span className="text-2xl">☁️</span>
                            <span className="text-[11px] uppercase tracking-wider font-bold">Enviar Vídeo</span>
                        </button>
                    </nav>

                    <style>
                        {`
                            @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
                            .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
                            .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
                        `}
                    </style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
