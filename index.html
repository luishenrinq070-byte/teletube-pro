<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeleTube Pro</title>
    
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
        {
            "imports": {
                "mtkruto": "https://cdn.jsdelivr.net/npm/@mtkruto/browser@0.142.0/esm/mod.js"
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white min-h-screen font-sans selection:bg-blue-500 selection:text-white">
    <div id="root"></div>

    <script type="module">
        console.log("Inicializando motor MTKruto (Web-First)...");

        try {
            // MTKruto é feito para o navegador. Sem bugs de Buffer ou Crypto!
            const { Client, StorageLocalStorage } = await import("mtkruto");
            
            window.TelegramClient = Client;
            window.StorageLocalStorage = StorageLocalStorage;
            
            console.log("Motor 100% Operacional e Pronto.");
            window.dispatchEvent(new Event('engine-ready'));
            
        } catch (error) {
            console.error("Falha Crítica no Motor:", error);
            document.body.innerHTML += `<div style="padding: 20px; color: white; text-align: center; background: #dc2626; position: fixed; top: 0; width: 100%; z-index: 50; box-shadow: 0 10px 20px rgba(0,0,0,0.5);">Erro Fatal ao carregar motor de conexão. Verifique sua conexão ou tente limpar o cache. Detalhe: ${error.message}</div>`;
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function Modal({ isOpen, title, message, onClose }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
                    <div className="bg-gray-800 rounded-2xl p-6 w-full max-w-sm border border-gray-700 shadow-2xl flex flex-col items-center text-center transform transition-all">
                        <div className="w-14 h-14 bg-blue-500/10 text-blue-400 rounded-full flex items-center justify-center text-3xl mb-4 border border-blue-500/20">
                            ℹ️
                        </div>
                        <h3 className="text-xl font-bold text-white mb-3">{title}</h3>
                        <p className="text-gray-300 mb-6 text-sm leading-relaxed break-words w-full">{message}</p>
                        <button 
                            onClick={onClose} 
                            className="w-full py-3.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 rounded-xl text-white font-bold transition-all shadow-lg shadow-blue-900/40">
                            Entendido
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            // Estados do Sistema
            const [isEngineReady, setIsEngineReady] = useState(false);
            const [status, setStatus] = useState('initial'); 
            const [activeTab, setActiveTab] = useState('acervo');
            
            // Credenciais do Usuário
            const [apiId, setApiId] = useState(localStorage.getItem('tg_api_id') || '');
            const [apiHash, setApiHash] = useState(localStorage.getItem('tg_api_hash') || '');
            const [channelId, setChannelId] = useState(localStorage.getItem('tg_channel_id') || '');
            
            // Dados Temporários do Login
            const [phoneNumber, setPhoneNumber] = useState('');
            const [phoneCode, setPhoneCode] = useState('');
            const [password, setPassword] = useState('');

            // Refs de Promessa (Para não travar a UI durante o login)
            const phonePromiseRef = useRef(null);
            const codePromiseRef = useRef(null);
            const passwordPromiseRef = useRef(null);
            
            // Dados da Galeria e Upload
            const [videos, setVideos] = useState([]);
            const [loadingVideos, setLoadingVideos] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploading, setUploading] = useState(false);
            const [videoTitle, setVideoTitle] = useState('');
            
            // Controle do Modal
            const [modalConfig, setModalConfig] = useState({ isOpen: false, title: '', message: '' });
            
            const fileInputRef = useRef(null);
            const clientRef = useRef(null);

            useEffect(() => {
                // Se já carregou rápido, ativa. Se não, espera o evento.
                if (window.TelegramClient && window.StorageLocalStorage) {
                    setIsEngineReady(true);
                } else {
                    const handleReady = () => setIsEngineReady(true);
                    window.addEventListener('engine-ready', handleReady);
                    return () => window.removeEventListener('engine-ready', handleReady);
                }
            }, []);

            // Disparador Universal de Notificações Visuais
            const showMessage = (title, message) => {
                setModalConfig({ isOpen: true, title, message: String(message) });
            };

            const handleConnect = async () => {
                if (!apiId || !apiHash || !channelId) {
                    return showMessage("Campos Vazios", "Por favor, preencha a API ID, API HASH e o ID do seu Canal.");
                }
                
                // Salva configurações base
                localStorage.setItem('tg_api_id', apiId);
                localStorage.setItem('tg_api_hash', apiHash);
                localStorage.setItem('tg_channel_id', channelId);
                
                setStatus('connecting');

                try {
                    // Instancia Cliente. O MTKruto salva tudo automaticamente no LocalStorage!
                    const client = new window.TelegramClient({
                        storage: new window.StorageLocalStorage(`tg_session_${apiId}`),
                        apiId: parseInt(apiId),
                        apiHash: apiHash
                    });
                    
                    clientRef.current = client;

                    // Fluxo Automático de Login
                    await client.start({
                        phone: async () => {
                            setStatus('auth_phone');
                            return new Promise(resolve => { phonePromiseRef.current = resolve });
                        },
                        code: async () => {
                            setStatus('auth_code');
                            return new Promise(resolve => { codePromiseRef.current = resolve });
                        },
                        password: async () => {
                            setStatus('auth_password');
                            return new Promise(resolve => { passwordPromiseRef.current = resolve });
                        }
                    });
                    
                    setStatus('connected');
                    loadVideos();

                } catch (e) {
                    console.error("Falha Fatal na Conexão:", e);
                    showMessage("Erro de Conexão", "Não foi possível conectar. Verifique sua internet, chaves de API, ou tente limpar os dados do navegador.");
                    setStatus('initial');
                }
            };

            const submitPhone = () => {
                if (!phoneNumber) return showMessage("Aviso", "Você precisa digitar um número.");
                if (phonePromiseRef.current) phonePromiseRef.current(phoneNumber);
            };

            const submitCode = () => {
                if (!phoneCode) return showMessage("Aviso", "Digite o código recebido.");
                if (codePromiseRef.current) codePromiseRef.current(phoneCode);
            };

            const submitPassword = () => {
                if (!password) return showMessage("Aviso", "Digite sua senha de segurança.");
                if (passwordPromiseRef.current) passwordPromiseRef.current(password);
            };

            const handleLogout = async () => {
                if (clientRef.current) {
                    try { await clientRef.current.disconnect(); } catch(e){}
                }
                clientRef.current = null;
                setStatus('initial');
            };

            const loadVideos = async () => {
                if (!clientRef.current) return;
                setLoadingVideos(true);
                try {
                    let peer = channelId;
                    if (!isNaN(channelId) && channelId.trim() !== '') {
                        peer = Number(channelId);
                    }

                    // Puxando mensagens nativamente
                    const history = clientRef.current.getHistory(peer, { limit: 50 });
                    const formattedVideos = [];
                    
                    // MTKruto usa iteradores assíncronos modernos
                    for await (const m of history) {
                        // Verifica rigorosamente se há um vídeo (seja em .video ou .document)
                        const hasMedia = m.video || (m.document && m.document.mimeType && m.document.mimeType.includes('video'));
                        
                        if (hasMedia) {
                            const title = m.caption || m.video?.fileName || m.document?.fileName || "Vídeo do Acervo";
                            const sizeBytes = m.video?.fileSize || m.document?.fileSize || 0;
                            
                            // Link mágico para streaming direto no app oficial do Telegram
                            const cleanChannelId = channelId.toString().replace('-100', '');
                            
                            formattedVideos.push({
                                id: m.id,
                                title: title,
                                size: sizeBytes ? (sizeBytes / (1024 * 1024)).toFixed(2) + ' MB' : 'MB Desconhecido',
                                date: m.date ? new Date(m.date).toLocaleDateString('pt-BR') : new Date().toLocaleDateString('pt-BR'),
                                deepLink: `https://t.me/c/${cleanChannelId}/${m.id}`
                            });
                        }
                    }
                    
                    setVideos(formattedVideos);
                } catch (e) {
                    console.error("Erro na leitura do Canal:", e);
                    showMessage("Erro de Leitura", "Falha ao buscar vídeos. Verifique se o ID do canal está correto e se sua conta está inscrita nele.");
                } finally {
                    setLoadingVideos(false);
                }
            };

            const handleUpload = async () => {
                const file = fileInputRef.current?.files[0];
                if (!file) return showMessage("Nenhum Arquivo", "Por favor, selecione um vídeo da sua galeria primeiro.");
                if (!clientRef.current) return;

                setUploading(true);
                setUploadProgress(0);

                // Simulador Assintótico de Progresso Visual (Para conforto do usuário durante upload)
                let currentProgress = 0;
                const progressInterval = setInterval(() => {
                    currentProgress += (95 - currentProgress) * 0.05;
                    setUploadProgress(Math.round(currentProgress));
                }, 500);

                try {
                    let peer = channelId;
                    if (!isNaN(channelId) && channelId.trim() !== '') {
                        peer = Number(channelId);
                    }

                    const messageText = videoTitle || file.name;
                    
                    // MTKruto processa NATIVAMENTE arquivos do navegador (File object)
                    await clientRef.current.sendDocument(peer, file, {
                        caption: messageText
                    });

                    // Completa a barra para 100%
                    clearInterval(progressInterval);
                    setUploadProgress(100);

                    // Pequeno delay para a animação do 100% antes de resetar
                    setTimeout(() => {
                        showMessage("Upload Concluído! 🎉", "O vídeo foi enviado e criptografado com sucesso para o seu canal do Telegram.");
                        setVideoTitle('');
                        if(fileInputRef.current) fileInputRef.current.value = '';
                        setActiveTab('acervo');
                        loadVideos();
                        setUploading(false);
                    }, 800);

                } catch (e) {
                    console.error("Erro drástico no upload:", e);
                    clearInterval(progressInterval);
                    setUploading(false);
                    setUploadProgress(0);
                    showMessage("Falha no Upload", "Houve uma quebra ao enviar o arquivo: " + e.message);
                }
            };

            if (status !== 'connected') {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen p-4 bg-gray-900">
                        <Modal {...modalConfig} onClose={() => setModalConfig({ ...modalConfig, isOpen: false })} />
                        
                        <div className="bg-gray-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-gray-700/50">
                            <div className="flex justify-center mb-6 relative">
                                <div className="absolute inset-0 bg-blue-500/20 blur-2xl rounded-full"></div>
                                <div className="w-20 h-20 bg-gradient-to-br from-blue-500 to-blue-700 rounded-2xl flex items-center justify-center shadow-lg relative z-10">
                                    <span className="text-4xl">🚀</span>
                                </div>
                            </div>
                            <h1 className="text-3xl font-extrabold mb-1 text-center text-white tracking-tight">TeleTube Pro</h1>
                            <p className="text-blue-400 text-center mb-8 text-sm font-medium">Uploads Ilimitados até 2GB</p>
                            
                            {!isEngineReady && (
                                <div className="bg-blue-900/30 text-blue-300 p-4 rounded-xl mb-6 text-center text-sm border border-blue-800/50 flex flex-col items-center justify-center gap-3">
                                    <div className="w-6 h-6 border-2 border-blue-400 border-t-transparent rounded-full animate-spin"></div>
                                    <span>Puxando Motor MTKruto Web...<br/><span className="opacity-70 text-xs">Pode levar até 5 segundos.</span></span>
                                </div>
                            )}

                            {status === 'initial' && (
                                <div className="space-y-5 animate-fade-in">
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">API ID</label>
                                        <input type="text" value={apiId} onChange={e => setApiId(e.target.value)} className="w-full p-4 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ex: 1234567" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">API HASH</label>
                                        <input type="text" value={apiHash} onChange={e => setApiHash(e.target.value)} className="w-full p-4 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ex: a1b2c3d4..." />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">ID do Canal Alvo</label>
                                        <input type="text" value={channelId} onChange={e => setChannelId(e.target.value)} className="w-full p-4 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all" placeholder="Ex: -10012345678" />
                                    </div>
                                    <button 
                                        onClick={handleConnect} 
                                        disabled={!isEngineReady}
                                        className={`w-full p-4 rounded-xl font-bold transition-all shadow-lg mt-6 ${isEngineReady ? 'bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white shadow-blue-900/50 hover:-translate-y-0.5' : 'bg-gray-700 text-gray-500 cursor-not-allowed'}`}>
                                        Conectar Sistema
                                    </button>
                                </div>
                            )}

                            {status === 'connecting' && (
                                <div className="flex flex-col items-center py-12 animate-fade-in">
                                    <div className="w-14 h-14 border-4 border-blue-500 border-b-transparent rounded-full animate-spin mb-6 shadow-[0_0_20px_rgba(59,130,246,0.5)]"></div>
                                    <p className="text-white font-bold text-lg">Estabelecendo WebSocket...</p>
                                    <p className="text-gray-400 text-sm mt-2 text-center">Trocando chaves criptográficas com o Telegram.</p>
                                </div>
                            )}

                            {status === 'auth_phone' && (
                                <div className="space-y-5 animate-fade-in">
                                    <div className="bg-gray-700/40 p-4 rounded-xl border border-gray-600/50 mb-2">
                                        <p className="text-gray-300 text-sm text-center">Para fazer uploads pesados, insira seu telefone do Telegram.</p>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Seu Número (com +55 e DDD)</label>
                                        <input type="tel" value={phoneNumber} onChange={e => setPhoneNumber(e.target.value)} className="w-full p-4 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none text-lg tracking-wide" placeholder="+5511999999999" />
                                    </div>
                                    <button onClick={submitPhone} className="w-full bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-xl font-bold transition-all shadow-lg shadow-blue-900/40">
                                        Solicitar Código SMS
                                    </button>
                                </div>
                            )}

                            {status === 'auth_code' && (
                                <div className="space-y-5 animate-fade-in">
                                    <div className="bg-green-500/10 p-4 rounded-xl border border-green-500/30 mb-2">
                                        <p className="text-green-400 text-sm text-center font-medium">Código enviado! Verifique o app oficial do Telegram no seu dispositivo.</p>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Código de Acesso</label>
                                        <input type="text" value={phoneCode} onChange={e => setPhoneCode(e.target.value)} className="w-full p-4 bg-gray-900 border border-gray-700 rounded-xl text-white font-mono text-center tracking-[0.5em] text-2xl focus:ring-2 focus:ring-green-500 outline-none" placeholder="12345" />
                                    </div>
                                    <button onClick={submitCode} className="w-full bg-green-600 hover:bg-green-500 text-white p-4 rounded-xl font-bold transition-all shadow-lg shadow-green-900/40">
                                        Validar Código
                                    </button>
                                </div>
                            )}

                            {status === 'auth_password' && (
                                <div className="space-y-5 animate-fade-in">
                                    <p className="text-gray-300 text-sm text-center mb-4">Esta conta possui Verificação em Duas Etapas (2FA) ativa.</p>
                                    <div>
                                        <label className="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Senha da Nuvem (2FA)</label>
                                        <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-4 bg-gray-900 border border-gray-700 rounded-xl text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Sua senha..." />
                                    </div>
                                    <button onClick={submitPassword} className="w-full bg-blue-600 hover:bg-blue-500 text-white p-4 rounded-xl font-bold transition-all shadow-lg shadow-blue-900/40">
                                        Desbloquear
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-gray-900 pb-24">
                    <Modal {...modalConfig} onClose={() => setModalConfig({ ...modalConfig, isOpen: false })} />

                    {/* Header PWA */}
                    <header className="bg-gray-800/80 backdrop-blur-xl p-4 shadow-lg sticky top-0 z-30 border-b border-gray-700/50 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-gradient-to-br from-blue-500 to-blue-700 rounded-xl flex items-center justify-center text-lg shadow-md shadow-blue-500/20">🚀</div>
                            <h1 className="text-xl font-extrabold text-white tracking-tight">TeleTube <span className="text-blue-500">Pro</span></h1>
                        </div>
                        <button onClick={handleLogout} className="text-xs font-bold text-red-400 hover:text-white px-4 py-2.5 bg-red-500/10 hover:bg-red-500 rounded-lg transition-all border border-red-500/20">
                            Sair / Trocar
                        </button>
                    </header>

                    <main className="flex-1 p-4 w-full max-w-4xl mx-auto mt-4">
                        
                        {/* Aba Acervo */}
                        {activeTab === 'acervo' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="flex justify-between items-end mb-2">
                                    <div>
                                        <h2 className="text-3xl font-bold text-white tracking-tight">Seu Acervo</h2>
                                        <p className="text-blue-400 text-sm mt-1">Lendo diretamente do Canal Seguro</p>
                                    </div>
                                    <button onClick={loadVideos} className="bg-gray-800 hover:bg-gray-700 active:bg-gray-600 px-5 py-2.5 rounded-xl text-white font-semibold flex items-center gap-2 transition-all border border-gray-700 shadow-md">
                                        <span>🔄</span> Recarregar
                                    </button>
                                </div>

                                {loadingVideos ? (
                                    <div className="flex flex-col items-center justify-center py-32">
                                        <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_20px_rgba(59,130,246,0.3)]"></div>
                                        <span className="text-gray-400 font-medium">Lendo Histórico do Canal...</span>
                                    </div>
                                ) : videos.length === 0 ? (
                                    <div className="text-center text-gray-500 py-24 bg-gray-800/30 rounded-3xl border-2 border-gray-700/50 border-dashed">
                                        <div className="text-6xl mb-6 opacity-40">🎬</div>
                                        <h3 className="text-xl font-bold text-gray-300 mb-2">Nenhum vídeo aqui</h3>
                                        <p className="text-sm">Vá para a aba "Enviar" e faça o seu primeiro upload gigante.</p>
                                    </div>
                                ) : (
                                    <div className="grid gap-5 sm:grid-cols-2">
                                        {videos.map(video => (
                                            <div key={video.id} className="bg-gray-800/80 p-5 rounded-2xl shadow-xl border border-gray-700/50 flex flex-col gap-5 hover:border-blue-500/50 transition-all hover:-translate-y-1 group">
                                                <div className="flex items-start gap-4">
                                                    <div className="w-14 h-14 shrink-0 bg-gray-900 rounded-xl flex items-center justify-center text-2xl border border-gray-700 group-hover:border-blue-500/30 group-hover:bg-blue-500/10 transition-colors">
                                                        📹
                                                    </div>
                                                    <div className="flex-1 min-w-0">
                                                        <h3 className="font-bold text-gray-100 truncate text-lg" title={video.title}>{video.title}</h3>
                                                        <div className="flex flex-wrap gap-2 text-xs font-medium text-gray-400 mt-2">
                                                            <span className="bg-gray-900/80 px-2.5 py-1 rounded-md border border-gray-700/50">📅 {video.date}</span>
                                                            <span className="bg-gray-900/80 px-2.5 py-1 rounded-md border border-gray-700/50 text-blue-400">💾 {video.size}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <a href={video.deepLink} target="_blank" rel="noopener noreferrer" className="w-full flex items-center justify-center gap-2 bg-blue-600/10 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/20 px-4 py-3.5 rounded-xl font-bold transition-all shadow-md">
                                                    <span>▶️</span> Assistir via Telegram (Stream)
                                                </a>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Aba Enviar */}
                        {activeTab === 'enviar' && (
                            <div className="animate-fade-in">
                                <div className="bg-gray-800/90 p-6 sm:p-10 rounded-[2rem] shadow-2xl border border-gray-700/50 relative overflow-hidden">
                                    <div className="absolute -top-20 -right-20 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>
                                    
                                    <h2 className="text-3xl font-bold text-white mb-2 tracking-tight">Novo Upload</h2>
                                    <p className="text-blue-400 mb-10 font-medium text-sm">Arquivos suportados até 2GB por envio.</p>
                                    
                                    <div className="space-y-8 relative z-10">
                                        <div>
                                            <label className="block text-gray-300 mb-2 font-bold text-sm uppercase tracking-wide">Título / Legenda</label>
                                            <textarea 
                                                value={videoTitle} 
                                                onChange={e => setVideoTitle(e.target.value)}
                                                className="w-full p-4 bg-gray-900 border border-gray-600 rounded-2xl text-white focus:ring-2 focus:ring-blue-500 outline-none resize-none transition-all placeholder-gray-600" 
                                                rows="3"
                                                placeholder="Ex: Aula de Marketing Avançado - Módulo 1 #curso"
                                                disabled={uploading}
                                            ></textarea>
                                        </div>

                                        <div>
                                            <label className="block text-gray-300 mb-2 font-bold text-sm uppercase tracking-wide">Selecionar Vídeo da Galeria</label>
                                            <div className="relative">
                                                <input 
                                                    type="file" 
                                                    accept="video/*" 
                                                    ref={fileInputRef}
                                                    className="w-full p-3 bg-gray-900 border border-gray-600 rounded-2xl text-gray-300 file:mr-4 file:py-3 file:px-6 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-500 file:cursor-pointer cursor-pointer focus:outline-none transition-all"
                                                    disabled={uploading}
                                                />
                                            </div>
                                        </div>

                                        {uploading && (
                                            <div className="bg-gray-900 p-6 rounded-2xl border border-blue-500/30 shadow-[0_0_15px_rgba(59,130,246,0.1)]">
                                                <div className="flex justify-between items-end mb-4">
                                                    <div>
                                                        <span className="block text-blue-400 font-bold text-sm mb-1">Empacotando e Enviando...</span>
                                                        <span className="text-gray-400 text-xs">Mantenha a tela ligada durante o envio.</span>
                                                    </div>
                                                    <span className="text-white font-black text-2xl">{uploadProgress}%</span>
                                                </div>
                                                <div className="w-full bg-gray-800 rounded-full h-5 border border-gray-700 overflow-hidden relative">
                                                    <div className="bg-gradient-to-r from-blue-600 to-blue-400 h-full transition-all duration-300 relative" style={{ width: `${uploadProgress}%` }}>
                                                        <div className="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4IiBoZWlnaHQ9IjgiPgo8cmVjdCB3aWR0aD0iOCIgaGVpZ2h0PSI4IiBmaWxsPSIjZmZmIiBmaWxsLW9wYWNpdHk9IjAuMSI+PC9yZWN0Pgo8L3N2Zz4=')] opacity-30"></div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        <button 
                                            onClick={handleUpload} 
                                            disabled={uploading}
                                            className={`w-full py-5 rounded-2xl font-black text-lg transition-all flex items-center justify-center gap-3 ${uploading ? 'bg-gray-800 text-gray-500 border border-gray-700 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white shadow-xl shadow-blue-900/30 hover:-translate-y-1'}`}>
                                            {uploading ? (
                                                <>
                                                    <div className="w-6 h-6 border-4 border-gray-500 border-t-transparent rounded-full animate-spin"></div>
                                                    Processando...
                                                </>
                                            ) : (
                                                <><span>☁️</span> Iniciar Upload Pesado</>
                                            )}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Menu Inferior Estilo App Nativo */}
                    <nav className="fixed bottom-0 w-full bg-gray-800/95 backdrop-blur-xl border-t border-gray-700/50 flex pb-safe z-30 shadow-[0_-10px_20px_rgba(0,0,0,0.4)]">
                        <button 
                            onClick={() => setActiveTab('acervo')} 
                            className={`flex-1 py-4 flex flex-col items-center gap-1.5 transition-colors relative ${activeTab === 'acervo' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-300'}`}>
                            {activeTab === 'acervo' && <div className="absolute top-0 w-16 h-1.5 bg-blue-500 rounded-b-full shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>}
                            <span className="text-2xl mt-1">📺</span>
                            <span className="text-[10px] uppercase tracking-widest font-black">Acervo</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('enviar')} 
                            className={`flex-1 py-4 flex flex-col items-center gap-1.5 transition-colors relative ${activeTab === 'enviar' ? 'text-blue-400' : 'text-gray-500 hover:text-gray-300'}`}>
                            {activeTab === 'enviar' && <div className="absolute top-0 w-16 h-1.5 bg-blue-500 rounded-b-full shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>}
                            <span className="text-2xl mt-1">☁️</span>
                            <span className="text-[10px] uppercase tracking-widest font-black">Enviar</span>
                        </button>
                    </nav>

                    <style>
                        {`
                            @keyframes fade-in { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
                            .animate-fade-in { animation: fade-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
                            .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 10px); }
                        `}
                    </style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
